on:
  push:
    branches:
      - master
      - devel
  pull_request:
    branches:
      - master
      - devel

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macOS-latest, r: 'release'}
          - {os: macOS-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RIBIOS_ANNOTATION_BACKEND: bioconductor
      RIBIOS_TEST_BACKENDS: bioconductor

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check

  R-CMD-check-mongodb:
    if: ${{ secrets.RIBIOS_ANNOTATION_SECRETS_JSON != '' }}
    runs-on: ubuntu-latest

    name: ubuntu-latest (release, mongodb+bioconductor)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RIBIOS_ANNOTATION_BACKEND: bioconductor
      RIBIOS_TEST_BACKENDS: bioconductor,mongodb
      RIBIOS_ANNOTATION_SECRETS_JSON: ${{ github.workspace }}/.github/secrets/ribiosAnnotation-secrets.json

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MongoDB secrets file
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.github/secrets"
          cat > "${{ github.workspace }}/.github/secrets/ribiosAnnotation-secrets.json" <<'EOF'
          ${{ secrets.RIBIOS_ANNOTATION_SECRETS_JSON }}
          EOF

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-rrelease-mongodb-results
          path: check
